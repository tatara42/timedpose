[workspace]
members = [
    "crates/timedpose-core",
    "crates/timedpose-infra",
    "crates/timedpose-ui",
]
resolver = "2"

[workspace.dependencies]
timedpose-core = { path = "crates/timedpose-core" }
timedpose-infra = { path = "crates/timedpose-infra" }

serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
toml = "0.8"
rand = "0.8"
directories = "5.0"

image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp", "bmp"] }
rodio = "0.19"
rfd = "0.15"
jwalk = "0.8"
crossbeam-channel = "0.5"

eframe = { version = "0.29", default-features = false, features = ["wgpu", "default_fonts", "wayland", "x11"] }
egui = "0.29"
wgpu = "23.0"

[profile.dev.package."*"]
opt-level = 3
